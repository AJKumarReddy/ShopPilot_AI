x-backend: &backend
  build: {context: ., dockerfile: backend/Dockerfile}
  env_file: .env
  environment:
    # Containers reach the bundled database over the Compose network.
    # An explicit DATABASE_URL in .env takes precedence over these defaults.
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports: ["127.0.0.1:${POSTGRES_PORT:-55432}:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 15
  migrate:
    <<: *backend
    command: ["alembic", "-c", "backend/alembic.ini", "upgrade", "head"]
    depends_on: {db: {condition: service_healthy}}
  seed:
    <<: *backend
    command: ["python", "scripts/seed_demo_users.py"]
    depends_on: {migrate: {condition: service_completed_successfully}}
  backend:
    <<: *backend
    ports: ["127.0.0.1:8000:8000"]
    depends_on: {seed: {condition: service_completed_successfully}}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/ready')"]
      interval: 10s
      timeout: 5s
      retries: 10
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        BACKEND_URL: ${BACKEND_URL:-http://backend:8000}
    ports: ["127.0.0.1:3000:3000"]
    depends_on: {backend: {condition: service_healthy}}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
volumes:
  postgres_data:
